<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Contingência</title>
<style>
  body { background:#12110f; color:#dcd7c9; font-family:Georgia,serif; line-height:1.7; margin:0; padding:16px; display:flex; justify-content:center; }
  .book { width:100%; max-width:680px; background:#1b1a16; border:1px solid #333029; border-left:4px solid #6e352c; padding:26px; }
  h1 { font-size:1.25rem; font-weight:normal; border-bottom:1px solid #333029; padding-bottom:8px; margin:0 0 14px; color:#ebe6d8; }
  label { display:block; font:11px monospace; text-transform:uppercase; color:#8c8678; margin:12px 0 4px; }
  input, textarea { width:100%; box-sizing:border-box; background:#13120f; border:1px solid #333029; color:#dcd7c9; padding:9px; font:15px Georgia,serif; }
  textarea { min-height:64px; resize:vertical; }
  button { background:#9e4737; color:#fff; border:none; padding:10px 18px; font:13px monospace; cursor:pointer; margin-top:12px; }
  button:disabled { background:#38352e; }
  .ghost { background:transparent; border:1px solid #333029; color:#8c8678; padding:6px 10px; font-size:11px; margin:0; }
  .top { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333029; padding-bottom:8px; margin-bottom:16px; font:12px monospace; color:#8c8678; }
  #log { max-height:58vh; overflow-y:auto; margin-bottom:16px; }
  .msg { margin-bottom:18px; padding-bottom:12px; border-bottom:1px dashed #292722; white-space:pre-wrap; text-align:justify; }
  .you { color:#9c9688; font-style:italic; border-left:2px solid #9e4737; padding-left:10px; border-bottom:none; }
  .time { display:block; font:11px monospace; color:#8c8678; margin-bottom:4px; }
  #err { font:12px monospace; color:#e06c53; margin-top:10px; }
</style>
</head>
<body>
<div class="book">
  <div id="tela1">
    <h1>CADERNO DE CAMPO — REGISTRO INDIVIDUAL</h1>
    <button type="button" class="ghost" onclick="aleatorio()">🎲 GERAR FICHA ALEATÓRIA</button>
    <label>Chave API (Groq gsk_... ou OpenRouter sk-or-...)</label>
    <input type="password" id="k" placeholder="Cole sua chave aqui">
    <label>Indivíduo (Nome, Idade, Físico e Traço)</label>
    <input type="text" id="p1" placeholder="Ex: Davi, 25 anos, barman, cauteloso, sem preparo militar">
    <label>Acompanhante na Residência</label>
    <input type="text" id="p2" placeholder="Ex: Lúcia (mãe, 56 anos, dor no joelho)">
    <label>Casa, Bairro e Suprimentos Reais</label>
    <textarea id="p3" placeholder="Ex: Casa simples de periferia, portão de ferro, mercado a 10 min. Água, comida para 3 dias, lanterna, canivete e celular."></textarea>
    <button type="button" id="b1" onclick="iniciar()">ABRIR DIÁRIO (DIA 1)</button>
    <div id="err"></div>
  </div>
  <div id="tela2" style="display:none;">
    <div class="top">
      <span id="relogio">DIA 1 — 07:30</span>
      <div><button type="button" class="ghost" onclick="baixar()">SALVAR .TXT</button> <button type="button" class="ghost" onclick="resetar()">NOVO</button></div>
    </div>
    <div id="log"></div>
    <textarea id="acao" placeholder="Escreva o que você faz, verifica ou diz em prosa natural..."></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span id="st" style="font:12px monospace;color:#8c8678;">Pronto.</span>
      <button type="button" id="b2" onclick="agir()">ANOTAR AÇÃO</button>
    </div>
  </div>
</div>
<script>
const PRESETS = [
  { p1:"Davi, 25 anos, barman, físico mediano, cauteloso", p2:"Lúcia (mãe, 56 anos, calma, mobilidade reduzida)", p3:"Casa simples de periferia com quarto, sala, cozinha e quintal murado com portão de ferro. Comida para 3 dias, garrafa 2L, lanterna, canivete e celular." },
  { p1:"Renata, 38 anos, técnica de enfermagem, exausta, observadora", p2:"Theo (filho de 7 anos, assustado com barulhos)", p3:"Apartamento térreo com grades nas janelas. Arroz e enlatados para 6 dias, caixa de primeiros socorros, chave inglesa e celular." },
  { p1:"Marcos, 44 anos, eletricista, sobrepeso, prático", p2:"Bento (cachorro vira-lata que late para passos na rua)", p3:"Casa geminada em rua estreita, muro baixo e laje. Caixa de ferramentas, 2 galões de água, botijão pela metade e rádio portátil." }
];
let g = { sys:"", h:[], d:1, hr:7, min:30 };
try {
  const sk = localStorage.getItem('k_colapso'); if (sk) document.getElementById('k').value = sk;
  const sv = localStorage.getItem('g_colapso'); if (sv) { g = JSON.parse(sv); mostrarDiario(); desenharTudo(); }
} catch(e) {}

function aleatorio() {
  const i = Math.floor(Math.random() * PRESETS.length);
  const f = PRESETS.slice(i, i + 1).shift();
  document.getElementById('p1').value = f.p1;
  document.getElementById('p2').value = f.p2;
  document.getElementById('p3').value = f.p3;
}
function hora() { return `DIA ${g.d} — ${String(g.hr).padStart(2,'0')}:${String(g.min).padStart(2,'0')}`; }
function tempo(m) {
  g.min += m;
  while (g.min >= 60) { g.min -= 60; g.hr++; }
  while (g.hr >= 24) { g.hr -= 24; g.d++; }
  document.getElementById('relogio').innerText = hora();
}
function mostrarDiario() {
  document.getElementById('tela1').style.display = 'none';
  document.getElementById('tela2').style.display = 'block';
  document.getElementById('relogio').innerText = hora();
}
async function ia(prompt) {
  const key = document.getElementById('k').value.trim() || localStorage.getItem('k_colapso');
  if (!key) throw new Error('Cole sua chave API primeiro.');
  localStorage.setItem('k_colapso', key);
  const isOR = key.startsWith('sk-or-');
  let url = 'https://openrouter.ai';
  let model = 'openrouter/free';
  if (!isOR) {
    url = 'https://groq.com';
    const mr = await fetch('https://groq.com', { headers:{ 'Authorization':'Bearer '+key } });
    const md = await mr.json();
    if (!mr.ok) throw new Error(md.error?.message || 'Chave Groq inválida');
    const validos = (md.data || []).map(x => x.id).filter(id => !id.includes('whisper') && !id.includes('guard') && !id.includes('tts') && !id.includes('orpheus') && !id.includes('3.3'));
    model = validos.find(id => id.includes('gpt-oss') || id.includes('qwen') || id.includes('llama-4') || id.includes('8b-instant')) || validos.shift();
  }
  const res = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
    body: JSON.stringify({ model, messages:[{ role:'system', content:g.sys }, ...g.h, { role:'user', content:prompt }], temperature:0.85, max_tokens:750 })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || 'Erro HTTP '+res.status);
  return (data.choices || []).slice(0, 1).shift().message.content;
}
async function iniciar() {
  const b = document.getElementById('b1'), er = document.getElementById('err');
  b.disabled = true; er.innerText = 'Conectando...';
  g.sys = `Narrador realista e cru de colapso social com surto de infecção agressiva (zumbis realistas, sem heróis). Protagonista: ${document.getElementById('p1').value||'Comum'}. Acompanhante: ${document.getElementById('p2').value||'Sozinho'}. Cenário/Itens: ${document.getElementById('p3').value||'Casa simples'}. Regras: 1. Segunda pessoa ("Você...") como diário. Sem números de vida/dano ou listas de opções. 2. Protagonista cansa rápido, treme sob adrenalina, sente sede e medo. 3. Fog of war e desinformação nas notícias. 4. Barulho atrai perigo; respeite a casa e reações humanas do acompanhante. 5. Considere [DADO] oculto sem citar regras. 6. Escreva 2 a 3 parágrafos densos em português do Brasil.`;
  try {
    const r = await ia('Inicie no Dia 1 às 07:30, antes do surto tomar o bairro. Mostre o despertar no quarto, luz e água funcionando, mas notícias vagas sobre casos estranhos em hospitais. Apresente a casa e o acompanhante.');
    g.h.push({ role:'assistant', content:r });
    localStorage.setItem('g_colapso', JSON.stringify(g));
    mostrarDiario(); add('narrator', r, hora());
  } catch(e) { er.innerText = 'Erro: ' + e.message; b.disabled = false; }
}
async function agir() {
  const inp = document.getElementById('acao'), txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  const b = document.getElementById('b2'), st = document.getElementById('st');
  b.disabled = true; st.innerText = 'Processando...';
  add('you', txt, hora());
  tempo(Math.floor(Math.random() * 12) + 3);
  const d = Math.floor(Math.random() * 100) + 1;
  const p = `[DADO:${d}/100] [${hora()}] AÇÃO: ${txt}`;
  try {
    const r = await ia(p);
    g.h.push({ role:'user', content:p }, { role:'assistant', content:r });
    if (g.h.length > 30) g.h = g.h.slice(-30);
    localStorage.setItem('g_colapso', JSON.stringify(g));
    add('narrator', r, hora()); st.innerText = 'Pronto.';
  } catch(e) { add('narrator', '[Erro: '+e.message+']', hora()); st.innerText = 'Falha na IA.'; }
  b.disabled = false; inp.focus();
}
function add(cls, txt, t) {
  const l = document.getElementById('log'), div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (cls === 'narrator') { const s = document.createElement('span'); s.className = 'time'; s.innerText = t; div.appendChild(s); }
  const c = document.createElement('div'); c.innerText = txt; div.appendChild(c);
  l.appendChild(div); l.scrollTop = l.scrollHeight;
}
function desenharTudo() {
  document.getElementById('log').innerHTML = '';
  g.h.forEach(m => add(m.role==='user'?'you':'narrator', m.role==='user'?m.content.split('AÇÃO: ').pop():m.content, hora()));
}
function resetar() { if (confirm('Apagar diário?')) { localStorage.removeItem('g_colapso'); location.reload(); } }
function baixar() {
  const b = new Blob([g.h.map(m => m.role==='user'?'> '+m.content.split('AÇÃO: ').pop():m.content).join('\n\n---\n\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = diario_dia_${g.d}.txt; a.click();
}
