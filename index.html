<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141413">
<title>Caderno de Campo — Registro Civil</title>
<style>
  :root { --bg: #141413; --paper: #1c1b18; --ink: #d6d2c4; --ink-dim: #8a8578; --accent: #a64b3a; --border: #33312b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Georgia, serif; line-height: 1.7; padding: 15px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 740px; background: var(--paper); border: 1px solid var(--border); padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  h1 { font-size: 1.35rem; font-weight: normal; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; color: #e8e4d8; }
  h2 { font-size: 1rem; font-weight: normal; color: var(--ink-dim); margin-top: 20px; border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 12px; }
  p.desc { font-size: 0.9rem; color: var(--ink-dim); margin-bottom: 18px; font-style: italic; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.78rem; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 5px; font-family: monospace; }
  input, textarea { width: 100%; background: #12110f; border: 1px solid var(--border); color: var(--ink); padding: 10px; font-family: Georgia, serif; font-size: 1rem; outline: none; }
  textarea { resize: vertical; min-height: 65px; }
  button { background: var(--accent); color: #f4f1ea; border: none; padding: 12px 22px; font-family: monospace; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }
  button:disabled { background: #3d3a35; cursor: not-allowed; }
  #game-screen { display: none; }
  .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; font-family: monospace; font-size: 0.82rem; color: var(--ink-dim); gap: 8px; flex-wrap: wrap; }
  #diary-log { max-height: 60vh; overflow-y: auto; padding-right: 8px; margin-bottom: 15px; }
  .entry { margin-bottom: 20px; }
  .entry.narrator { white-space: pre-wrap; text-align: justify; }
  .entry.player { color: #b5afa0; border-left: 2px solid var(--accent); padding-left: 12px; font-style: italic; }
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  #status-msg { font-family: monospace; font-size: 0.8rem; color: #e06c53; }
  .btn-sec { background: transparent; border: 1px solid var(--border); color: var(--ink-dim); padding: 5px 10px; font-size: 0.72rem; margin-top: 0; }
</style>
</head>
<body>
<div class="container">
  <div id="setup-screen">
    <h1>REGISTRO INDIVIDUAL DE CONTINGÊNCIA</h1>
    <p class="desc">Preencha com honestidade. Suas limitações físicas reais, o layout da sua casa e as pessoas sob seu teto definem suas chances.</p>
    <h2>1. O Indivíduo</h2>
    <div class="field"><label>Nome, Idade e Condição Física Real</label><input type="text" id="f-bio" placeholder="Ex: Carlos, 34 anos. Sedentário, miopia moderada, dor lombar."></div>
    <div class="field"><label>Ocupação e Habilidades Práticas</label><input type="text" id="f-skills" placeholder="Ex: Técnico de informática. Conserta encanamento básico, dirige bem, sem treino com armas."></div>
    <div class="field"><label>Estado Psicológico, Medos ou Dependências</label><input type="text" id="f-psych" placeholder="Ex: Ansioso sob pressão, fumante, medo de escuro ou sangue."></div>
    <h2>2. O Ambiente Doméstico e Núcleo</h2>
    <div class="field"><label>Descrição Real da Residência e Bairro</label><textarea id="f-home" placeholder="Ex: Casa térrea em bairro denso. Muro baixo, portão de grade, janelas com veneziana. Caixa d'água de 500L."></textarea></div>
    <div class="field"><label>Pessoas ou Animais na Casa</label><textarea id="f-family" placeholder="Ex: Esposa (enfermeira, exausta), filha de 6 anos (assustada) e um cachorro que late para barulhos."></textarea></div>
    <div class="field"><label>Suprimentos e Ferramentas Reais</label><textarea id="f-items" placeholder="Ex: Comida para 5 dias, 2 galões de água, caixa de ferramentas, remédios comuns, celular com 45% de bateria."></textarea></div>
    <button id="start-btn" type="button" onclick="startGame()">INICIAR REGISTRO (DIA 1)</button>
    <div id="setup-msg" style="margin-top:10px;font-family:monospace;font-size:0.85rem;color:#e06c53;"></div>
  </div>
  <div id="game-screen">
    <div class="header-bar">
      <span id="clock-display">DIA 1 — 18:40</span>
      <div>
        <button class="btn-sec" type="button" onclick="exportDiary()">BAIXAR DIÁRIO (.TXT)</button>
        <button class="btn-sec" type="button" onclick="resetGame()">NOVO REGISTRO</button>
      </div>
    </div>
    <div id="diary-log"></div>
    <div class="input-area">
      <textarea id="action-input" placeholder="Escreva o que você faz, observa ou diz aos outros em prosa natural..."></textarea>
      <div class="controls">
        <span id="status-msg">Aguardando entrada...</span>
        <button id="send-btn" type="button" onclick="submitAction()">REGISTRAR AÇÃO</button>
      </div>
    </div>
  </div>
</div>
<script>
let state = { profile: {}, history: [], day: 1, hour: 18, minute: 40 };
window.onload = () => {
  const saved = localStorage.getItem('colapso_app_save');
  if (saved) {
    state = JSON.parse(saved);
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    renderHistory();
    updateClock();
  }
};
function updateClock() {
  const h = String(state.hour).padStart(2, '0');
  const m = String(state.minute).padStart(2, '0');
  document.getElementById('clock-display').innerText = `DIA ${state.day} — ${h}:${m}`;
}
function advanceTime(mins) {
  state.minute += mins;
  while (state.minute >= 60) { state.minute -= 60; state.hour += 1; }
  while (state.hour >= 24) { state.hour -= 24; state.day += 1; }
  updateClock();
}
function buildSystem() {
  const p = state.profile;
  return `Você é o motor narrativo realista, cru e literário de um colapso social com surto de infecção agressiva (estilo zumbis tratados com realismo biológico e sociológico, sem super-heróis). DADOS REAIS DO PROTAGONISTA: Indivíduo: ${p.bio}. Habilidades: ${p.skills}. Psicológico: ${p.psych}. Residência/Bairro: ${p.home}. Núcleo/Animais: ${p.family}. Suprimentos: ${p.items}. REGRAS: 1. Escreva em segunda pessoa ("Você...") como diário imediato. NUNCA use números de vida, dano ou listas de opções. 2. Protagonista comum: cansa rápido, treme sob adrenalina, corta a mão sem luvas, sente sede e ansiedade. 3. FOG OF WAR: Notícias na TV ou celular são confusas, contraditórias e cheias de boatos. 4. Barulho atrai perigo; sair na rua é arriscado; respeite o layout real da casa. 5. Dê reações humanas reais às pessoas e animais na casa. 6. Respeite o [DADO OCULTO] sem mencionar dados. 7. Escreva 2 a 4 parágrafos densos em português do Brasil, parando no momento presente.`;
}
async function callServer(prompt, isStart) {
  const res = await fetch('/api/jogar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, history: state.history, systemPrompt: buildSystem() })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erro no servidor');
  return data.reply;
}
async function startGame() {
  const btn = document.getElementById('start-btn');
  const msg = document.getElementById('setup-msg');
  state.profile = {
    bio: document.getElementById('f-bio').value || 'Adulto comum.',
    skills: document.getElementById('f-skills').value || 'Habilidades básicas.',
    psych: document.getElementById('f-psych').value || 'Tenso.',
    home: document.getElementById('f-home').value || 'Residência urbana comum.',
    family: document.getElementById('f-family').value || 'Sozinho em casa.',
    items: document.getElementById('f-items').value || 'Itens básicos.'
  };
  btn.disabled = true;
  msg.innerText = 'Iniciando registro...';
  try {
    const prompt = 'Inicie a simulação no Dia 1, às 18:40, dentro da casa do protagonista. Mostre notícias confusas na TV ou celular sobre tumultos e agressões nos bairros vizinhos, a reação imediata das pessoas/animais e a atmosfera tensa do local.';
    const reply = await callServer(prompt, true);
    state.history.push({ role: 'assistant', content: reply });
    save();
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    renderHistory();
  } catch (e) {
    msg.innerText = 'Erro: ' + e.message;
    btn.disabled = false;
  }
}
async function submitAction() {
  const inp = document.getElementById('action-input');
  const txt = inp.value.trim();
  if (!txt) return;
  const btn = document.getElementById('send-btn');
  const st = document.getElementById('status-msg');
  btn.disabled = true;
  inp.disabled = true;
  st.innerText = 'Processando consequências...';
  appendLog('player', txt);
  inp.value = '';
  advanceTime(Math.floor(Math.random() * 15) + 5);
  const d100 = Math.floor(Math.random() * 100) + 1;
  const sorte = d100 <= 12 ? 'FALHA CRÍTICA / IMPREVISTO' : (d100 <= 35 ? 'ATRITO / DIFICULDADE' : (d100 >= 90 ? 'SORTE / VANTAGEM' : 'NEUTRO'));
  const fullPrompt = `[DADO OCULTO: ${d100}/100 -> ${sorte}] [HORÁRIO: Dia ${state.day}, ${String(state.hour).padStart(2,'0')}:${String(state.minute).padStart(2,'0')}] AÇÃO DO JOGADOR: ${txt}`;
  try {
    const reply = await callServer(fullPrompt, false);
    state.history.push({ role: 'user', content: fullPrompt });
    state.history.push({ role: 'assistant', content: reply });
    if (state.history.length > 40) state.history = state.history.slice(-40);
    save();
    appendLog('narrator', reply);
st.innerText = 'Aguardando entrada...';
} catch (e) {
appendLog('narrator', `[Erro: ${e.message}]`);
st.innerText = 'Erro ao processar.';
} finally {
btn.disabled = false;
inp.disabled = false;
inp.focus();
}
}
function appendLog(type, text) {
const log = document.getElementById('diary-log');
const div = document.createElement('div');
div.className = 'entry ' + type;
div.innerText = text;
log.appendChild(div);
log.scrollTop = log.scrollHeight;
}
function renderHistory() {
const log = document.getElementById('diary-log');
log.innerHTML = '';
for (const item of state.history) {
const cleanText = item.role === 'user' ? item.content.split('AÇÃO DO JOGADOR: ').pop() : item.content;
appendLog(item.role === 'user' ? 'player' : 'narrator', cleanText);
}
}
function save() { localStorage.setItem('colapso_app_save', JSON.stringify(state)); }
function resetGame() {
if (confirm('Apagar este diário e começar uma nova ficha?')) {
localStorage.removeItem('colapso_app_save');
location.reload();
}
}
function exportDiary() {
const text = state.history.map(m => m.role === 'user' ? '> ' + m.content.split('AÇÃO DO JOGADOR: ').pop() : m.content).join('\n\n---\n\n');
const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = `diario_dia_${state.day}.txt`;
a.click();
}
</script>
</body>
</html>
